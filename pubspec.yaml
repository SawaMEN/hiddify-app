name: hiddify
description: Android Multi Protocol Proxy Frontend.
publish_to: "none"
version: 4.1.2+40102

environment:
  sdk: ^3.10.4
  flutter: ^3.38.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  slang: ^4.8.1
  slang_flutter: ^4.8.0
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  hooks_riverpod: ^2.4.10
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.4
  rxdart: ^0.28.0
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  shared_preferences: ^2.5.2
  dio: ^5.4.1
  ffi: ^2.1.2
  path_provider: ^2.1.1
  mobile_scanner: ^7.2.0
  flutter_native_splash: ^2.3.10
  share_plus: ^10.1.0
  package_info_plus: ^8.1.0
  url_launcher: ^6.2.5
  sentry_flutter: 9.3.0
  sentry_dart_plugin: ^2.4.1
  path: ^1.9.0
  loggy: ^2.0.3
  meta: ^1.15.0
  dartx: ^1.2.0
  uuid: ^4.3.3
  tint: ^2.0.1
  accessibility_tools: ^2.2.3
  neat_periodic_task: ^2.0.1
  go_router: ^16.2.4
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  sliver_tools: ^0.2.12
  font_awesome_flutter: ^10.7.0
  upgrader: ^11.3.0
  toastification: ^2.3.0
  version: ^3.0.2
  qr_flutter: ^4.1.0
  flutter_displaymode: ^0.6.0
  dio_smart_retry: ^7.0.1
  dart_mappable: ^4.2.1
  fluentui_system_icons: ^1.1.229
  json_path: ^0.7.1
  in_app_review: ^2.0.10
  circle_flags:
    git: https://github.com/hiddify-com/flutter_circle_flags.git
  fixnum: ^1.1.0
  protobuf: ^5.0.0
  grpc: ^4.0.1
  dynamic_color: ^1.7.0
  flutter_typeahead: ^5.0.1
  simple_icons: ^10.1.3
  basic_utils: ^5.7.0
  text_scroll: ^0.2.0
  flutter_markdown_plus: ^1.0.6
  file_picker: ^8.1.7
  installed_apps:
    git: https://github.com/VB10/installed_apps
  recase: ^4.1.0
  app_links: ^6.4.0
  humanizer: ^3.0.1

dev_dependencies:
  lint: ^2.3.0
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  riverpod_generator: ^2.4.3
  drift_dev: ^2.21.0
  slang_build_runner: ^4.4.0
  flutter_gen_runner: ^5.4.0
  dart_mappable_builder: ^4.2.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.svg
    - assets/images/connect_norouz.PNG
    - assets/images/disconnect_norouz.PNG
    - assets/images/world_map.png
    - assets/images/source/ic_launcher_border.png

  fonts:
    - family: Shabnam
      fonts:
        - asset: assets/fonts/Shabnam.ttf
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/source/ic_launcher_splash.png
  android_gravity: center
  android_12:
    color: "#ffffff"
    image: assets/images/source/ic_launcher_foreground.png

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  upload_sources: true
  log_level: info
  ignore_missing: true
