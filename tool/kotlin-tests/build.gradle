plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

repositories {
    maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
    mavenCentral()
}

kotlin {
    jvmToolchain(17)
}

// Compile the production files directly; no copied implementations or Android stubs.
// This suite is independent of Android test variants unavailable in the Android build.
sourceSets {
    main {
        kotlin {
            srcDir '../../android/app/src/main/kotlin'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileTransfer.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeSubscriptionContent.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileFileReplacement.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileFileRemoval.kt'
            include 'com/hiddify/hiddify/nativelog/NativeLogPresentation.kt'
            include 'com/hiddify/hiddify/nativelog/NativeLogFiles.kt'
            include 'com/hiddify/hiddify/nativecore/NativeSettingsDocument.kt'
            include 'com/hiddify/hiddify/nativecore/NativeReleasePolicy.kt'
            include 'com/hiddify/hiddify/nativecore/NativeRuntimeInitialization.kt'
            include 'com/hiddify/hiddify/nativeui/NativeWifiGuideContent.kt'
            include 'com/hiddify/hiddify/nativeui/NativeSavedEnum.kt'
            include 'com/hiddify/hiddify/nativediagnostics/NativeDiagnosticEndpoint.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileImportCancellation.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileValidation.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeImportSummary.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeSubscriptionMetadata.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeQrCodec.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeJsonDocument.kt'
            include 'com/hiddify/hiddify/nativecore/NativeOutboundModels.kt'
            include 'com/hiddify/hiddify/nativecore/NativeLanSharingLink.kt'
            include 'com/hiddify/hiddify/nativecore/NativeGeneralOptions.kt'
            include 'com/hiddify/hiddify/nativecore/NativeStoredNumbers.kt'
            include 'com/hiddify/hiddify/nativecore/NativeAutoPingPolicy.kt'
            include 'com/hiddify/hiddify/nativecore/NativeDnsOptions.kt'
            include 'com/hiddify/hiddify/nativecore/NativeTlsOptions.kt'
            include 'com/hiddify/hiddify/nativecore/NativeConfigChoices.kt'
            include 'com/hiddify/hiddify/nativecore/NativeServiceModeOptions.kt'
            include 'com/hiddify/hiddify/nativecore/NativeCoreOptionsProjection.kt'
            include 'com/hiddify/hiddify/nativecore/NativeTrafficStats.kt'
            include 'com/hiddify/hiddify/nativecore/NativeStatsStream.kt'
            include 'com/hiddify/hiddify/nativecore/NativeSpeedSample.kt'
            include 'com/hiddify/hiddify/nativecore/NativeTunnelMtuPresets.kt'
            include 'com/hiddify/hiddify/nativecore/NativeOutboundPresentation.kt'
            include 'com/hiddify/hiddify/nativepreferences/NativeOutboundSort.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeFreeProfiles.kt'
            include 'com/hiddify/hiddify/nativeprofile/NativeProfileOverrides.kt'
            include 'com/hiddify/hiddify/nativediagnostics/NativeDiagnosticModels.kt'
            include 'com/hiddify/hiddify/nativerouting/NativePerAppBackup.kt'
            include 'com/hiddify/hiddify/privacy/NativeTrafficFilters.kt'
            include 'com/hiddify/hiddify/privacy/BinaryXml.kt'
            include 'com/hiddify/hiddify/privacy/RootAccess.kt'
            include 'com/hiddify/hiddify/privacy/NativeProxyPrivacy.kt'
            include 'com/hiddify/hiddify/privacy/NativeCommunityLists.kt'
            include 'com/hiddify/hiddify/privacy/NativeRegionalOptions.kt'
            include 'com/hiddify/hiddify/privacy/NativeRegionalPackages.kt'
            include 'com/hiddify/hiddify/nativeconnection/NativeConnectionPolicy.kt'
            include 'com/hiddify/hiddify/nativeconnection/NativeBackgroundPermissionPolicy.kt'
            include 'com/hiddify/hiddify/nativeconnection/NativeRecoveryPolicy.kt'
            include 'com/hiddify/hiddify/nativeconnection/NativeStartupCancellation.kt'
            include 'com/hiddify/hiddify/ServiceStartTracker.kt'
            include 'com/hiddify/hiddify/constant/Status.kt'
            include 'com/hiddify/hiddify/nativeconnection/NativeServerRanker.kt'
            include 'com/hiddify/hiddify/nativeprivacy/NativePrivacySetup.kt'
            include 'com/hiddify/hiddify/sharing/HotspotInterfaceSelection.kt'
            include 'com/hiddify/hiddify/sharing/HotspotRootRules.kt'
            include 'com/hiddify/hiddify/sharing/HotspotWifiQr.kt'
        }
    }
    test {
        kotlin.srcDir '../../android/app/src/test/kotlin'
    }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0'
    testImplementation 'junit:junit:4.13.2'
}

test {
    useJUnit()
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}
