allprojects {
    repositories {
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        mavenCentral()
        google()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.plugins.withId('com.android.library') {
        project.androidComponents.finalizeDsl { androidDsl ->
            androidDsl.ndkVersion = "30.0.16248370"
            if (androidDsl.compileSdk == 37 && androidDsl.compileSdkMinor == null) {
                androidDsl.compileSdkMinor = 0
            }
        }
    }
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // flutter_displaymode 0.7.0 still declares compileSdk 33 internally,
    // while its AndroidX dependencies require API 34+. Keep the workaround
    // scoped to this plugin until the package updates its Android config.
    if (project.name == 'flutter_displaymode') {
        project.plugins.withId('com.android.library') {
            project.android.compileSdk = 36
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
