plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.10.0" 
    id "com.squareup.wire" version "7.1.0"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No release keystore defined. Non-production release builds will use debug signing."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

// Production artifacts must never silently fall back to the debug certificate. The CI build
// exports CHANNEL=prod for stable releases; local/dev release builds keep their existing fallback.
if (System.getenv('CHANNEL') == 'prod' && !hasKeyStore) {
    throw new GradleException('Production Android release requires android/key.properties and a valid release keystore.')
}

def declaredVersion = (file('../../pubspec.yaml').text =~ /(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)\s*$/)
if (!declaredVersion.find()) throw new GradleException('pubspec.yaml must declare version and build number')
def canonicalVersionName = declaredVersion.group(1)
def canonicalVersionCode = declaredVersion.group(2)
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: canonicalVersionCode

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: canonicalVersionName
if (flutterVersionName != canonicalVersionName || flutterVersionCode != canonicalVersionCode) {
    throw new GradleException('Flutter version metadata must match pubspec.yaml')
}

android {
    namespace 'com.hiddify.hiddify'
    testNamespace "test.com.hiddify.hiddify"
    compileSdkVersion 37
    compileSdkMinor = 0
    ndkVersion "30.0.16248370"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // The fork must install alongside upstream, with its own data and providers.
        applicationId "app.vetroff.client"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        resourceConfigurations.addAll(["en", "ru"])

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packaging {
        jniLibs {
            excludes += [
                "**/armeabi/*.so",
                "**/armeabi-v7a/*.so",
                "**/x86/*.so",
                "**/x86_64/*.so",
                "**/riscv64/*.so",
            ]
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            ndk {
                abiFilters "arm64-v8a"
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        compose true
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.13.0'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation("com.squareup.wire:wire-grpc-client:7.1.0")

    implementation 'io.grpc:grpc-okhttp:1.84.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.84.0'
    implementation 'io.grpc:grpc-stub:1.84.0'

    // Native Kotlin/Compose UI. Flutter remains temporarily available as a fallback
    // while profiles, subscriptions, routing and advanced settings are migrated screen-by-screen.
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
