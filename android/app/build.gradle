plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "com.squareup.wire" version "7.1.0"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No release keystore defined. Non-production release builds will use debug signing."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

// Production artifacts must never silently fall back to the debug certificate. The CI build
// exports CHANNEL=prod for stable releases; local/dev release builds keep their existing fallback.
if (System.getenv('CHANNEL') == 'prod' && !hasKeyStore) {
    throw new GradleException('Production Android release requires android/key.properties and a valid release keystore.')
}

def versionProperties = new Properties()
rootProject.file('../version.properties').withInputStream { versionProperties.load(it) }
def canonicalVersionName = versionProperties.getProperty('versionName')
def canonicalVersionCode = versionProperties.getProperty('versionCode')
if (!(canonicalVersionName ==~ /\d+\.\d+\.\d+/) || !(canonicalVersionCode ==~ /[1-9]\d*/)) {
    throw new GradleException('version.properties must declare versionName and a positive versionCode')
}
def buildChannel = System.getenv('CHANNEL') ?: 'dev'
if (!(buildChannel in ['dev', 'prod'])) throw new GradleException('CHANNEL must be dev or prod')

android {
    namespace 'com.hiddify.hiddify'
    testNamespace "test.com.hiddify.hiddify"
    compileSdkVersion 37
    compileSdkMinor = 0
    ndkVersion "30.0.16248370"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // The fork must install alongside upstream, with its own data and providers.
        applicationId "app.vetroff.client"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode canonicalVersionCode.toInteger()
        versionName canonicalVersionName
        buildConfigField "String", "CHANNEL", "\"${buildChannel}\""
        resourceConfigurations.addAll(["en", "ru"])

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packaging {
        jniLibs {
            excludes += [
                "**/armeabi/*.so",
                "**/armeabi-v7a/*.so",
                "**/x86/*.so",
                "**/x86_64/*.so",
                "**/riscv64/*.so",
            ]
        }
    }

    if (hasKeyStore) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasKeyStore) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            ndk {
                abiFilters "arm64-v8a"
                debugSymbolLevel 'FULL'
            }
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
        compose true
    }
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.13.0'
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation("com.squareup.wire:wire-grpc-client:7.1.0")

    implementation 'io.grpc:grpc-okhttp:1.84.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.84.0'
    implementation 'io.grpc:grpc-stub:1.84.0'

    // Standalone Kotlin/Compose UI; no engine or generated cross-platform plugins.
    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
