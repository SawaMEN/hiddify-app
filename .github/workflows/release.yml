name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'update-all-2026-10-04'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    with:
      upload-artifact: true
      tag-name: "${{ github.ref_type == 'tag' && github.ref_name || 'dev-latest' }}"
      channel: "${{ github.ref_type == 'tag' && !endsWith(github.ref_name, 'dev') && 'prod' || 'dev' }}"
