name: macOS Core Integration

on:
  push:
    branches:
      - feat/macos-swift-arm64
    paths:
      - "macos/PacketTunnel/**"
      - "macos/Shared/**"
      - "macos/scripts/generate-xcode-project.sh"
      - ".github/workflows/macos-integrated-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: macos-core-integrated-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-core:
    name: Compile Packet Tunnel against pinned native Go core
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download latest successful forked core build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="HiddifyCore-macos-5bcb778cbe1d"
          # The artifact name includes the actual *core* revision. Do not
          # silently link a previously built (and potentially no-TUN) core.
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" --jq '.artifacts | map(select(.expired == false)) | .[0].workflow_run.id // empty')"
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "Missing successful pinned-core artifact: $ARTIFACT_NAME. Run macOS Native Core Build first." >&2
            exit 1
          fi
          mkdir -p macos/Core/HiddifyCore.xcframework
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name "$ARTIFACT_NAME" --dir macos/Core/HiddifyCore.xcframework
          test -d macos/Core/HiddifyCore.xcframework/macos-arm64/HiddifyCore.framework
      - name: Install native project generator
        run: brew install xcodegen
      - name: Compile real Go ↔ Swift Network Extension
        run: |
          set -euo pipefail
          bash macos/scripts/generate-xcode-project.sh
          xcodebuild -project macos/VetrOFF.xcodeproj \
            -scheme VetrOFF -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
