name: Android Update CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'dependencies.properties'
      - 'Makefile'
      - 'tool/**'
      - 'test/**'
      - '.github/workflows/android-update-ci.yml'

concurrency:
  group: android-update-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Configure Flutter Maven Central mirror
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FLUTTER_ROOT"]) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          text = path.read_text()
          needle = '''repositories {
                  google()
                  mavenCentral()
              }'''
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          replacement = f'''repositories {{
                  {mirror}
                  google()
                  mavenCentral()
              }}'''
          if mirror in text:
              print(f"Flutter Maven Central mirror already configured: {path}")
          elif needle in text:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit(f"Unexpected Flutter Gradle settings format: {path}")
          PY

      - name: Toolchain info
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install build dependencies
        run: make android-apk-install-deps

      - name: Resolve Dart dependencies
        timeout-minutes: 10
        run: flutter pub get

      - name: Report outdated Dart dependencies
        continue-on-error: true
        timeout-minutes: 5
        run: flutter pub outdated

      - name: Generate translations
        timeout-minutes: 5
        run: dart run slang

      - name: Generate Dart sources
        timeout-minutes: 10
        # FlutterGen 5.14+ materializes outputs from a post-process builder.
        # A build filter can prevent assets.gen.dart/fonts.gen.dart from being
        # emitted even though the main builders completed successfully.
        run: dart run build_runner build

      - name: Check async runtime regressions
        run: dart tool/check_async_runtime.dart

      - name: Test startup screen regressions
        run: flutter test

      - name: Analyze Dart
        timeout-minutes: 10
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Download Android core
        timeout-minutes: 10
        run: make android-libs

      - name: Build Android ARM64 release APK
        env:
          SENTRY_DSN: ''
        run: flutter build apk --release --target=lib/main.dart --target-platform android-arm64
