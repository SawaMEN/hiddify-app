name: TLS UI and WARP recovery regressions
on:
  workflow_dispatch:
  push:
    branches: ['fix/tls-sheets-warp', 'fix/profile-presets-scroll']
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Check resources and project
        run: python3 tool/check_native_project.py
      - name: Install dependencies and Android compile SDK
        run: |
          make android-apk-install-deps
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Fetch verified shipped Android core
        env:
          GH_TOKEN: ${{ github.token }}
        run: make android-apk-prepare
      - name: Compile production Android and Compose sources
        run: ./android/gradlew -p android :app:compileReleaseKotlin --console=plain
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test TLS dependencies, profile capabilities and WARP recovery
        run: ./android/gradlew -p tool/kotlin-tests test --console=plain
      - name: Verify all recovery peers with real WARP and AWG traffic
        if: github.ref_name == 'fix/tls-sheets-warp'
        env:
          FREE_AUDIT_DIR: ${{ runner.temp }}/warp-audit
          FREE_AUDIT_WARP_ONLY: '1'
          FREE_AUDIT_ALL_WARP_PEERS: '1'
        run: |
          umask 077
          trap 'rm -rf "$FREE_AUDIT_DIR"' EXIT
          ./android/gradlew -p tool/kotlin-tests freeAudit --console=plain
          base=https://github.com/SawaMEN/hiddify-core/releases/download/sawamen-22fb84fdd93a-3827d3a871dd-panel8
          mkdir -p "$RUNNER_TEMP/free-core"
          curl -fsSL "$base/sing-box-linux-amd64.tar.gz" -o "$RUNNER_TEMP/core.tar.gz"
          curl -fsSL "$base/sing-box-linux-amd64.tar.gz.sha256" -o "$RUNNER_TEMP/core.sha256"
          python -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"]); assert hashlib.sha256((p/"core.tar.gz").read_bytes()).hexdigest() == (p/"core.sha256").read_text().split()[0]'
          tar --no-same-owner -xzf "$RUNNER_TEMP/core.tar.gz" -C "$RUNNER_TEMP/free-core"
          python tool/audit_free_profile_traffic.py "$RUNNER_TEMP/free-core/hiddify-core-linux-amd64" "$FREE_AUDIT_DIR"
