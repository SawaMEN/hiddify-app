name: Material UI checks

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/translations/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/material-ui-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_SUPPRESS_ANALYTICS: true
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run slang
      - run: dart run build_runner build
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
