name: Build Android ARM64

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  BUILD_TARGET: "${{ inputs.channel == 'prod' && 'lib/main_prod.dart' || 'lib/main.dart' }}"
  APK_NAME: "${{ inputs.channel == 'dev' && 'Hiddify-Android-arm64-v8a-dev.apk' || 'Hiddify-Android-arm64-v8a.apk' }}"

jobs:
  build-android-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        env:
          CHANNEL: stable
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Flutter Maven Central mirror
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FLUTTER_ROOT"]) / "packages/flutter_tools/gradle/settings.gradle.kts"
          text = path.read_text()
          needle = """repositories {
                  google()
                  mavenCentral()
              }"""
          replacement = """repositories {
                  maven { url = uri(\"https://maven-central.storage-download.googleapis.com/maven2/\") }
                  google()
                  mavenCentral()
              }"""
          if needle not in text:
              raise SystemExit(f"Unexpected Flutter Gradle settings format: {path}")
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          make android-apk-install-deps
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Setup Android signing
        if: ${{ inputs.upload-artifact }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Prepare Android
        run: make android-apk-prepare

      - name: Analyze Dart errors
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Dart analyzer log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dart-analyze-log
          path: analyze.log
          retention-days: 1

      - name: Fail on Dart analyzer errors
        if: ${{ steps.analyze.outputs.status != '0' }}
        run: exit "${{ steps.analyze.outputs.status }}"

      - name: Build Android ARM64 APK
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          fastforge package \
            --platform android \
            --targets apk \
            --skip-clean \
            --build-target="${BUILD_TARGET}" \
            --build-target-platform=android-arm64 \
            --build-dart-define=sentry_dsn="${SENTRY_DSN}"

      - name: Collect and verify ARM64 APK
        run: |
          mkdir -p out
          APK_PATH="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f \( -name 'app-release.apk' -o -name '*arm64-v8a*.apk' \) | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Android release APK was not produced"
            find build/app/outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          if unzip -Z1 "$APK_PATH" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK contains unsupported non-ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u
            exit 1
          fi

          if ! unzip -Z1 "$APK_PATH" | grep -q '^lib/arm64-v8a/'; then
            echo "APK does not contain ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u || true
            exit 1
          fi

          cp "$APK_PATH" "out/${APK_NAME}"
          ls -lh out/

      - name: Upload artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v6
        with:
          name: android-arm64-v8a
          path: ./out/${{ env.APK_NAME }}
          retention-days: 1

  update-draft:
    if: ${{ inputs.upload-artifact && inputs.tag-name == 'draft' }}
    needs: build-android-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Delete current draft assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: draft
          deleteOnlyFromDrafts: false

      - name: Prepare release message
        continue-on-error: true
        run: |
          sed 's|RELEASE_TAG|draft|g' ./.github/release_message.md > release.md

      - name: Create or update draft release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/${{ env.APK_NAME }}
          name: draft
          tag_name: draft
          body_path: ./release.md
          prerelease: true

  upload-release:
    if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: build-android-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v7
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Move rolling dev tag to current commit
        if: ${{ inputs.channel == 'dev' && inputs.tag-name == 'dev-latest' }}
        run: |
          git tag -f dev-latest "${GITHUB_SHA}"
          git push --force origin refs/tags/dev-latest

      - name: Prepare release message
        run: |
          sed 's|RELEASE_TAG|${{ inputs.tag-name }}|g' ./.github/release_message.md > release.md

      - name: Upload release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: true
          make_latest: false
          name: ${{ inputs.channel == 'dev' && 'Hiddify Dev' || inputs.tag-name }}
          tag_name: ${{ inputs.tag-name }}
          body_path: ./release.md
          files: ./out/${{ env.APK_NAME }}
