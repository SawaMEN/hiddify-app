name: Build Android ARM64

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"
      run-checks:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: false

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  APK_NAME: "${{ inputs.channel == 'dev' && 'vetroff-Android-arm64-v8a-dev.apk' || 'vetroff-Android-arm64-v8a.apk' }}"

jobs:
  analyze:
    if: ${{ inputs.run-checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Check standalone Kotlin sources and resources
        run: python3 tool/check_native_project.py

  test:
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0
      - name: Run existing native and release-tool tests
        run: |
          ./android/gradlew -p tool/kotlin-tests test --console=plain
          python3 tool/test_appcast.py
          python3 tool/test_app_version.py
      - name: Upload native Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-kotlin-test-reports
          path: tool/kotlin-tests/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 7

  build-android-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hiddify-core/go.mod
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Install build dependencies
        run: make android-apk-install-deps

      - name: Setup Android signing
        if: ${{ inputs.upload-artifact }}
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/key.jks android/key.properties

          if [ -z "${ANDROID_SIGNING_KEY:-}" ] || \
             [ -z "${ANDROID_SIGNING_STORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_SIGNING_KEY_PASSWORD:-}" ] || \
             [ -z "${ANDROID_SIGNING_KEY_ALIAS:-}" ]; then
            echo "::warning::Android signing secrets are incomplete; using the debug signing config for this CI build."
            exit 0
          fi

          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > android/key.jks
          if [ ! -s android/key.jks ]; then
            echo "::error::Decoded Android signing keystore is empty."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=$(pwd)/android/key.jks
          storePassword=${ANDROID_SIGNING_STORE_PASSWORD}
          keyPassword=${ANDROID_SIGNING_KEY_PASSWORD}
          keyAlias=${ANDROID_SIGNING_KEY_ALIAS}
          EOF

          keytool -list \
            -keystore android/key.jks \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "ndk;30.0.16248370" "platforms;android-24" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Check app and release version
        run: python3 tool/check_app_version.py --tag "${{ inputs.tag-name }}" --channel "${{ inputs.channel }}"

      - name: Build the pinned VPN core
        run: make android-apk-prepare

      - name: Check core privacy and adaptive connection policies
        if: ${{ inputs.run-tests }}
        working-directory: hiddify-core
        run: go test -ldflags=-checklinkname=0 -tags with_quic,with_utls,with_gvisor,with_wireguard,with_clash_api ./v2/config ./v2/hcore ./platform/mobile

      - name: Build standalone Kotlin Android ARM64 APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Collect and verify ARM64 APK
        run: |
          mkdir -p out
          APK_PATH="$(find build/app/outputs/apk/release -maxdepth 1 -type f \( -name 'app-release.apk' -o -name '*arm64-v8a*.apk' \) | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Android release APK was not produced"
            find build/app/outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          if unzip -Z1 "$APK_PATH" | grep -Eq '(^lib/[^/]+/libflutter\.so$|^lib/[^/]+/libapp\.so$|^assets/flutter_assets/)'; then
            echo "Standalone Kotlin APK must not package a Flutter engine or Dart snapshot"
            exit 1
          fi

          if unzip -Z1 "$APK_PATH" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK contains unsupported non-ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u
            exit 1
          fi

          if ! unzip -Z1 "$APK_PATH" | grep -q '^lib/arm64-v8a/'; then
            echo "APK does not contain ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u || true
            exit 1
          fi

          python3 - "$APK_PATH" <<'PYROOT'
          import struct, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              binary = apk.read('lib/arm64-v8a/libhiddify-root.so')
          if binary[:6] != b'\x7fELF\x02\x01' or struct.unpack_from('<HH', binary, 16) != (3, 183):
              raise SystemExit('Root companion must be an ARM64 ELF PIE executable')
          print('Packaged ARM64 root companion verified')
          import os, re, subprocess
          from pathlib import Path
          sys.path.insert(0, 'tool')
          from check_app_version import apk_minimum_sdk, declared_version
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/aapt2'
          metadata = subprocess.check_output([str(aapt), 'dump', 'badging', sys.argv[1]], text=True)
          package = re.search(r"^package: name='([^']+)'", metadata, re.M)
          if package is None or package.group(1) != 'app.vetroff.client':
              raise SystemExit('APK must use the independent VetrOFF package app.vetroff.client')
          manifest = subprocess.check_output([str(aapt), 'dump', 'xmltree', sys.argv[1], '--file', 'AndroidManifest.xml'], text=True)
          # Release resource optimization can shorten res/xml/shortcuts.xml.
          # Find the compiled shortcut XML by its activity string, not its source path.
          needle = 'com.hiddify.hiddify.ShortcutActivity'
          with zipfile.ZipFile(sys.argv[1]) as apk:
              shortcut_files = [name for name in apk.namelist()
                  if name != 'AndroidManifest.xml' and name.endswith('.xml')
                  and any(needle.encode(encoding) in apk.read(name) for encoding in ('utf-8', 'utf-16le'))]
          if len(shortcut_files) != 1:
              raise SystemExit(f'Expected one compiled shortcut resource, found {len(shortcut_files)}')
          shortcuts = subprocess.check_output([str(aapt), 'dump', 'xmltree', sys.argv[1], '--file', shortcut_files[0]], text=True)
          if 'app.vetroff.client.privacy.files' not in manifest or 'app.hiddify.com.privacy.files' in manifest:
              raise SystemExit('APK FileProvider must belong to VetrOFF')
          if 'app.vetroff.client' not in shortcuts or 'app.hiddify.com' in shortcuts:
              raise SystemExit('Packaged shortcut must launch VetrOFF rather than upstream')
          if 'com.hiddify.hiddify.MainActivity' not in manifest:
              raise SystemExit('Changing applicationId must preserve the native activity namespace')
          print('Independent VetrOFF package, FileProvider and shortcut verified')
          version, build = declared_version()
          actual = re.search(r"package:.*versionCode='([^']+)'.*versionName='([^']+)'", metadata)
          if actual is None or actual.groups() != (build, version):
              raise SystemExit('APK version does not match version.properties')
          minimum = apk_minimum_sdk(metadata)
          if minimum != 29:
              raise SystemExit(f'APK must require Android 10 / API 29; actual minSdk={minimum}')
          print(f'APK version {version}+{build}, minimum Android 10 verified')
          PYROOT

          cp "$APK_PATH" "out/${APK_NAME}"
          ls -lh out/

      - name: Upload artifact
        if: ${{ inputs.upload-artifact || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-arm64-v8a
          path: ./out/${{ env.APK_NAME }}
          retention-days: 7

      - name: Upload core provenance
        if: ${{ inputs.upload-artifact || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-core-provenance
          path: android/app/libs/hiddify-core.provenance.json
          retention-days: 7

  update-draft:
    needs:
      - analyze
      - test
      - build-android-arm64
    if: >-
      ${{
        always() &&
        inputs.upload-artifact &&
        inputs.tag-name == 'draft' &&
        needs.build-android-arm64.result == 'success' &&
        (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Delete current draft assets
        uses: 8Mi-Tech/delete-release-assets-action@71a740cf4364bc69448e0294b8abadffadfb3288
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: draft
          deleteOnlyFromDrafts: false

      - name: Prepare release message
        continue-on-error: true
        run: |
          sed 's|RELEASE_TAG|draft|g' ./.github/release_message.md > release.md

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/${{ env.APK_NAME }}
          name: draft
          tag_name: draft
          body_path: ./release.md
          prerelease: true

  upload-release:
    needs:
      - analyze
      - test
      - build-android-arm64
    if: >-
      ${{
        always() &&
        inputs.upload-artifact &&
        inputs.tag-name != 'draft' &&
        needs.build-android-arm64.result == 'success' &&
        (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Move rolling dev tag to current commit
        if: ${{ inputs.channel == 'dev' && inputs.tag-name == 'dev-latest' }}
        run: |
          git tag -f dev-latest "${GITHUB_SHA}"
          git push --force origin refs/tags/dev-latest

      - name: Prepare release message
        run: |
          sed 's|RELEASE_TAG|${{ inputs.tag-name }}|g' ./.github/release_message.md > release.md

      - name: Generate fork update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag-name }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 tool/generate_appcast.py --directory out --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL"

      - name: Upload release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ inputs.channel != 'prod' }}
          make_latest: ${{ inputs.channel == 'prod' }}
          name: ${{ inputs.channel == 'dev' && 'VetrOFF Client Dev' || inputs.tag-name }}
          tag_name: ${{ inputs.tag-name }}
          body_path: ./release.md
          files: ./out/*
