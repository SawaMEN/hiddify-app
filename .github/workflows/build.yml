name: Build Android ARM64

on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"
      run-checks:
        type: boolean
        default: true
      run-tests:
        type: boolean
        default: false

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.47.6'
  BUILD_TARGET: "${{ inputs.channel == 'prod' && 'lib/main_prod.dart' || 'lib/main.dart' }}"
  APK_NAME: "${{ inputs.channel == 'dev' && 'vetroff-Android-arm64-v8a-dev.apk' || 'vetroff-Android-arm64-v8a.apk' }}"

jobs:
  analyze:
    if: ${{ inputs.run-checks }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        env:
          CHANNEL: stable
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache generated Dart state
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/build
            lib/gen/assets.gen.dart
            lib/gen/fonts.gen.dart
          key: build-runner-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'build.yaml', 'tool/flag_builder_compat/**', 'assets/**') }}

      - name: Generate Dart sources
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build

      - name: Check async runtime regressions
        run: dart tool/check_async_runtime.dart

      - name: Analyze Dart errors
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-warnings --no-fatal-infos 2>&1 | tee analyze.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Dart analyzer log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dart-analyze-log
          path: analyze.log
          retention-days: 1

      - name: Fail on Dart analyzer errors
        if: ${{ steps.analyze.outputs.status != '0' }}
        run: exit "${{ steps.analyze.outputs.status }}"

  test:
    if: ${{ inputs.run-tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        env:
          CHANNEL: stable
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache generated Dart state
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/build
            lib/gen/assets.gen.dart
            lib/gen/fonts.gen.dart
          key: build-runner-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'build.yaml', 'tool/flag_builder_compat/**', 'assets/**') }}

      - name: Generate Dart sources
        run: |
          flutter pub get
          dart run slang
          dart run build_runner build

      - name: Run tests
        run: |
          flutter test
          python3 tool/test_appcast.py
          python3 tool/test_app_version.py

      - name: Upload visual test failures
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: flutter-golden-diffs
          path: test/failures/
          if-no-files-found: ignore
          retention-days: 3

  build-android-arm64:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hiddify-core/go.mod
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        env:
          CHANNEL: stable
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Configure Flutter Maven Central mirror
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["FLUTTER_ROOT"]) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          text = path.read_text()
          needle = '''repositories {
                  google()
                  mavenCentral()
              }'''
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          replacement = f'''repositories {{
                  {mirror}
                  google()
                  mavenCentral()
              }}'''
          if mirror in text:
              print(f"Flutter Maven Central mirror already configured: {path}")
          elif needle in text:
              path.write_text(text.replace(needle, replacement, 1))
          else:
              raise SystemExit(f"Unexpected Flutter Gradle settings format: {path}")
          PY

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Cache generated Dart state
        uses: actions/cache@v6.1.0
        with:
          path: |
            .dart_tool/build
            lib/gen/assets.gen.dart
            lib/gen/fonts.gen.dart
          key: build-runner-v2-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock', 'pubspec.yaml', 'build.yaml', 'tool/flag_builder_compat/**', 'assets/**') }}

      - name: Install build dependencies
        run: make android-apk-install-deps

      - name: Setup Android signing
        if: ${{ inputs.upload-artifact }}
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail

          rm -f android/key.jks android/key.properties

          if [ -z "${ANDROID_SIGNING_KEY:-}" ] || \
             [ -z "${ANDROID_SIGNING_STORE_PASSWORD:-}" ] || \
             [ -z "${ANDROID_SIGNING_KEY_PASSWORD:-}" ] || \
             [ -z "${ANDROID_SIGNING_KEY_ALIAS:-}" ]; then
            echo "::warning::Android signing secrets are incomplete; using the debug signing config for this CI build."
            exit 0
          fi

          printf '%s' "$ANDROID_SIGNING_KEY" | base64 --decode > android/key.jks
          if [ ! -s android/key.jks ]; then
            echo "::error::Decoded Android signing keystore is empty."
            exit 1
          fi

          cat > android/key.properties <<EOF
          storeFile=$(pwd)/android/key.jks
          storePassword=${ANDROID_SIGNING_STORE_PASSWORD}
          keyPassword=${ANDROID_SIGNING_KEY_PASSWORD}
          keyAlias=${ANDROID_SIGNING_KEY_ALIAS}
          EOF

          keytool -list \
            -keystore android/key.jks \
            -storepass "$ANDROID_SIGNING_STORE_PASSWORD" \
            -alias "$ANDROID_SIGNING_KEY_ALIAS" >/dev/null

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          "$SDKMANAGER" "ndk;30.0.16248370" "platforms;android-24" "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Check app and release version
        run: python3 tool/check_app_version.py --tag "${{ inputs.tag-name }}" --channel "${{ inputs.channel }}"

      - name: Generate app sources and build the pinned core
        run: make android-apk-prepare

      - name: Build Android ARM64 APK
        run: |
          flutter build apk \
            --release \
            --target="${BUILD_TARGET}" \
            --target-platform android-arm64

      - name: Collect and verify ARM64 APK
        run: |
          mkdir -p out
          APK_PATH="$(find build/app/outputs/flutter-apk -maxdepth 1 -type f \( -name 'app-release.apk' -o -name '*arm64-v8a*.apk' \) | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Android release APK was not produced"
            find build/app/outputs -maxdepth 4 -type f -print || true
            exit 1
          fi

          if unzip -Z1 "$APK_PATH" | grep -Eq '^lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "APK contains unsupported non-ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u
            exit 1
          fi

          if ! unzip -Z1 "$APK_PATH" | grep -q '^lib/arm64-v8a/'; then
            echo "APK does not contain ARM64 native libraries"
            unzip -Z1 "$APK_PATH" | grep '^lib/' | sort -u || true
            exit 1
          fi

          python3 - "$APK_PATH" <<'PYROOT'
          import struct, sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              binary = apk.read('lib/arm64-v8a/libhiddify-root.so')
          if binary[:6] != b'\x7fELF\x02\x01' or struct.unpack_from('<HH', binary, 16) != (3, 183):
              raise SystemExit('Root companion must be an ARM64 ELF PIE executable')
          print('Packaged ARM64 root companion verified')
          import os, re, subprocess
          from pathlib import Path
          sys.path.insert(0, 'tool')
          from check_app_version import declared_version
          aapt = Path(os.environ['ANDROID_HOME']) / 'build-tools/37.0.0/aapt2'
          metadata = subprocess.check_output([str(aapt), 'dump', 'badging', sys.argv[1]], text=True)
          version, build = declared_version()
          actual = re.search(r"package:.*versionCode='([^']+)'.*versionName='([^']+)'", metadata)
          if actual is None or actual.groups() != (build, version):
              raise SystemExit('APK version does not match pubspec.yaml')
          print(f'APK version {version}+{build} verified')
          PYROOT

          cp "$APK_PATH" "out/${APK_NAME}"
          ls -lh out/

      - name: Upload artifact
        if: ${{ inputs.upload-artifact || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-arm64-v8a
          path: ./out/${{ env.APK_NAME }}
          retention-days: 7

      - name: Upload core provenance
        if: ${{ inputs.upload-artifact || github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-core-provenance
          path: android/app/libs/hiddify-core.provenance.json
          retention-days: 7

  update-draft:
    needs:
      - analyze
      - test
      - build-android-arm64
    if: >-
      ${{
        always() &&
        inputs.upload-artifact &&
        inputs.tag-name == 'draft' &&
        needs.build-android-arm64.result == 'success' &&
        (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Delete current draft assets
        uses: 8Mi-Tech/delete-release-assets-action@71a740cf4364bc69448e0294b8abadffadfb3288
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: draft
          deleteOnlyFromDrafts: false

      - name: Prepare release message
        continue-on-error: true
        run: |
          sed 's|RELEASE_TAG|draft|g' ./.github/release_message.md > release.md

      - name: Create or update draft release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/${{ env.APK_NAME }}
          name: draft
          tag_name: draft
          body_path: ./release.md
          prerelease: true

  upload-release:
    needs:
      - analyze
      - test
      - build-android-arm64
    if: >-
      ${{
        always() &&
        inputs.upload-artifact &&
        inputs.tag-name != 'draft' &&
        needs.build-android-arm64.result == 'success' &&
        (needs.analyze.result == 'success' || needs.analyze.result == 'skipped') &&
        (needs.test.result == 'success' || needs.test.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: android-arm64-v8a
          path: ./out

      - name: Move rolling dev tag to current commit
        if: ${{ inputs.channel == 'dev' && inputs.tag-name == 'dev-latest' }}
        run: |
          git tag -f dev-latest "${GITHUB_SHA}"
          git push --force origin refs/tags/dev-latest

      - name: Prepare release message
        run: |
          sed 's|RELEASE_TAG|${{ inputs.tag-name }}|g' ./.github/release_message.md > release.md

      - name: Generate fork update manifest
        env:
          RELEASE_TAG: ${{ inputs.tag-name }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: python3 tool/generate_appcast.py --directory out --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --channel "$RELEASE_CHANNEL"

      - name: Upload release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: ${{ inputs.channel != 'prod' }}
          make_latest: ${{ inputs.channel == 'prod' }}
          name: ${{ inputs.channel == 'dev' && 'VetrOFF Client Dev' || inputs.tag-name }}
          tag_name: ${{ inputs.tag-name }}
          body_path: ./release.md
          files: ./out/*
