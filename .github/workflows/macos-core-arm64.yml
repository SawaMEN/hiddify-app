name: macOS Native Core Build

on:
  push:
    branches:
      - main
      - feat/macos-swift-arm64
    paths:
      - "macos/scripts/build-hiddify-core.sh"
      - ".github/workflows/macos-core-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-xcframework:
    name: Build forked Go libbox for macOS
    runs-on: macos-15
    timeout-minutes: 55
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Checkout pinned user core
        uses: actions/checkout@v4
        with:
          repository: SawaMEN/hiddify-core
          ref: 242bfa7d6014e6a57cd6d62b7d9604fb2a2926ed
          path: _build/hiddify-core
          submodules: recursive
          persist-credentials: false
      - name: Install Go matching core
        uses: actions/setup-go@v5
        with:
          go-version-file: _build/hiddify-core/go.mod
          cache: false
      - name: Build native XCFramework
        env:
          VETROFF_CORE_DIR: ${{ github.workspace }}/_build/hiddify-core
          VETROFF_CORE_OUT: ${{ github.workspace }}/_build/output
          VETROFF_CORE_SHA: 242bfa7d6014e6a57cd6d62b7d9604fb2a2926ed
        run: bash macos/scripts/build-hiddify-core.sh
      - name: Verify ARM64 framework and direct Swift/Go call
        env:
          VETROFF_CORE_OUT: ${{ github.workspace }}/_build/output
        run: |
          set -euo pipefail
          FW=$(find "$VETROFF_CORE_OUT/HiddifyCore.xcframework" -type d -name HiddifyCore.framework | head -n 1)
          test -n "$FW"
          BIN="$FW/HiddifyCore"
          test -f "$BIN"
          xcrun lipo -archs "$BIN"
          if ! xcrun lipo -archs "$BIN" | grep -qw arm64; then
            echo "Missing Apple Silicon architecture" >&2
            exit 1
          fi
          xcrun swiftc -target arm64-apple-macos14.0 \
            -F "$(dirname "$FW")" -framework HiddifyCore \
            -framework AppKit -framework CoreText \
            -framework UniformTypeIdentifiers -framework SystemConfiguration \
            -framework Network -framework CoreServices -framework ApplicationServices \
            -framework Carbon -framework Security -lresolv \
            -o "$RUNNER_TEMP/vetroff-core-smoke" \
            macos/Integration/CoreSmoke.swift
          "$RUNNER_TEMP/vetroff-core-smoke"
      - name: Link native core into macOS Packet Tunnel
        env:
          VETROFF_CORE_OUT: ${{ github.workspace }}/_build/output
        run: |
          set -euo pipefail
          brew install xcodegen
          mkdir -p macos/Core
          ln -s "$VETROFF_CORE_OUT/HiddifyCore.xcframework" macos/Core/HiddifyCore.xcframework
          bash macos/scripts/generate-xcode-project.sh
          xcodebuild -project macos/VetrOFF.xcodeproj \
            -scheme VetrOFF -configuration Debug \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Upload built native framework
        uses: actions/upload-artifact@v4
        with:
          name: HiddifyCore-macos-arm64-experiment
          path: _build/output/HiddifyCore.xcframework
          if-no-files-found: error
          retention-days: 7
