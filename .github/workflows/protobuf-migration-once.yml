name: Protobuf 6 Migration

on:
  push:
    branches:
      - update-all-2026-10-04

permissions:
  contents: write

concurrency:
  group: protobuf-6-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout app
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout Hiddify Core 4.1.0 proto sources
        uses: actions/checkout@v7
        with:
          repository: hiddify/hiddify-core
          ref: v4.1.0
          path: hiddify-core

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Configure Flutter Maven Central mirror
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['FLUTTER_ROOT']) / 'packages/flutter_tools/gradle/settings.gradle.kts'
          text = path.read_text()
          needle = '''repositories {
                  google()
                  mavenCentral()
              }'''
          mirror = 'maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }'
          replacement = f'''repositories {{
                  {mirror}
                  google()
                  mavenCentral()
              }}'''
          if mirror not in text:
              if needle not in text:
                  raise SystemExit(f'Unexpected Flutter Gradle settings format: {path}')
              path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Install protobuf compiler and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          make android-apk-install-deps
          dart pub global activate protoc_plugin 25.1.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          protoc --version

      - name: Upgrade Dart protobuf runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pubspec.yaml')
          text = path.read_text()
          replacements = {
              '  protobuf: ^5.0.0': '  protobuf: ^6.1.0',
              '  grpc: ^4.0.1': '  grpc: ^5.1.0',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected dependency not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          flutter pub get

      - name: Regenerate Dart protobuf and gRPC sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/hiddifycore/generated
          mkdir -p lib/hiddifycore/generated
          output_dir="$GITHUB_WORKSPACE/lib/hiddifycore/generated"
          cd hiddify-core
          mapfile -t proto_files < <(find v2 extension -type f -name '*.proto' -print | sort)
          if [ "${#proto_files[@]}" -eq 0 ]; then
            echo 'No Hiddify Core proto files found'
            exit 1
          fi
          protoc \
            --proto_path=. \
            --proto_path=/usr/include \
            --dart_out=grpc:"$output_dir" \
            "${proto_files[@]}" \
            google/protobuf/timestamp.proto

      - name: Regenerate project sources
        run: |
          dart run slang
          dart run build_runner build

      - name: Analyze Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Download Android core
        run: make android-libs

      - name: Build Android ARM64 release APK
        env:
          SENTRY_DSN: ''
        run: flutter build apk --release --target=lib/main.dart --target-platform android-arm64

      - name: Commit protobuf 6 migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock lib/hiddifycore/generated
          if git diff --cached --quiet; then
            echo 'No protobuf migration changes to commit'
            exit 0
          fi
          git commit -m 'chore(deps): migrate Dart protobuf stack to 6.1'
          git push origin HEAD:update-all-2026-10-04
