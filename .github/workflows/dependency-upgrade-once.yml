name: Dependency Upgrade Once

on:
  push:
    branches:
      - update-all-2026-10-03

permissions:
  contents: write

concurrency:
  group: dependency-upgrade-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter 3.47.2
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install build dependencies
        run: make android-apk-install-deps

      - name: Upgrade Dart dependencies
        run: flutter pub upgrade --major-versions

      - name: Generate translations
        run: dart run slang

      - name: Generate Dart sources
        run: dart run build_runner build

      - name: Analyze Dart
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Download Android core
        run: make android-libs

      - name: Build Android release APK
        env:
          SENTRY_DSN: ''
        run: flutter build apk --release --target=lib/main.dart

      - name: Commit dependency updates
        shell: bash
        run: |
          if git diff --quiet -- pubspec.yaml pubspec.lock; then
            echo "No dependency updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml pubspec.lock
          git commit -m "chore(deps): upgrade Flutter dependencies"
          git push origin HEAD:update-all-2026-10-03
