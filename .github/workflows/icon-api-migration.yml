name: Icon API migration

on:
  push:
    branches:
      - update-all-2026-10-03

permissions:
  contents: write

jobs:
  migrate:
    if: "${{ github.event.head_commit.message != 'fix(ui): migrate icon APIs' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: update-all-2026-10-03
          fetch-depth: 0

      - name: Apply icon API migration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new))

          replace(
              'lib/features/profile/details/json_editor.dart',
              'const _downArrow = SizedBox(width: _expandIconWidth, child: Icon(FontAwesomeIcons.caretDown, size: 14));',
              'const _downArrow = SizedBox(width: _expandIconWidth, child: FaIcon(FontAwesomeIcons.caretDown, size: 14));',
          )
          replace(
              'lib/features/profile/details/json_editor.dart',
              'const _rightArrow = SizedBox(width: _expandIconWidth, child: Icon(FontAwesomeIcons.caretRight, size: 14));',
              'const _rightArrow = SizedBox(width: _expandIconWidth, child: FaIcon(FontAwesomeIcons.caretRight, size: 14));',
          )

          replace(
              'lib/features/home/widget/connection_button.dart',
              'Icon(FontAwesomeIcons.shieldHalved, size: 16, color: Theme.of(context).colorScheme.secondary)',
              'FaIcon(FontAwesomeIcons.shieldHalved, size: 16, color: Theme.of(context).colorScheme.secondary)',
          )

          replace(
              'lib/features/profile/widget/profile_tile_main.dart',
              'icon: _getLinkIcon(subInfo.webPageUrl!, FluentIcons.building_shop_24_regular),',
              'icon: _getLinkIcon(subInfo.webPageUrl!, const Icon(FluentIcons.building_shop_24_regular)),',
          )
          replace(
              'lib/features/profile/widget/profile_tile_main.dart',
              'icon: _getLinkIcon(subInfo.supportUrl!, FontAwesomeIcons.headset),',
              'icon: _getLinkIcon(subInfo.supportUrl!, const FaIcon(FontAwesomeIcons.headset)),',
          )
          replace(
              'lib/features/profile/widget/profile_tile_main.dart',
              '''  IconData _getLinkIcon(String url, [IconData? icon]) {
    final uri = Uri.parse(url);
    final host = uri.host.toLowerCase();

    if (host.endsWith('telegram.me') || host.endsWith('t.me')) {
      return FontAwesomeIcons.telegram;
    }
    if (host.endsWith('instagram.com')) {
      return FontAwesomeIcons.instagram;
    }
    if (host.endsWith('twitter.com')) {
      return FontAwesomeIcons.xTwitter;
    }
    if (host.endsWith('facebook.com')) {
      return FontAwesomeIcons.facebook;
    }
    if (host.endsWith('hiddify.com')) {
      // return IconData();
    }
    return icon ?? FluentIcons.link_24_regular;
  }''',
              '''  Widget _getLinkIcon(String url, Widget fallback) {
    final uri = Uri.parse(url);
    final host = uri.host.toLowerCase();

    if (host.endsWith('telegram.me') || host.endsWith('t.me')) {
      return const FaIcon(FontAwesomeIcons.telegram);
    }
    if (host.endsWith('instagram.com')) {
      return const FaIcon(FontAwesomeIcons.instagram);
    }
    if (host.endsWith('twitter.com') || host.endsWith('x.com')) {
      return const FaIcon(FontAwesomeIcons.xTwitter);
    }
    if (host.endsWith('facebook.com')) {
      return const FaIcon(FontAwesomeIcons.facebook);
    }
    return fallback;
  }''',
          )
          replace(
              'lib/features/profile/widget/profile_tile_main.dart',
              '  final IconData icon;\n  final String label;',
              '  final Widget icon;\n  final String label;',
          )
          replace(
              'lib/features/profile/widget/profile_tile_main.dart',
              '          Icon(icon, size: 20, color: theme.colorScheme.onSurfaceVariant),',
              '''          IconTheme(
            data: IconThemeData(size: 20, color: theme.colorScheme.onSurfaceVariant),
            child: icon,
          ),''',
          )

          replace(
              'lib/features/proxy/active/ip_widget.dart',
              '  "azure": OrgIconData(SimpleIcons.microsoftazure, SimpleIconColors.microsoftazure),',
              '  "azure": OrgIconData(Icons.cloud, Color(0xFF0078D4)),',
          )
          replace(
              'lib/features/proxy/active/ip_widget.dart',
              '  "amazon": OrgIconData(SimpleIcons.amazonaws, SimpleIconColors.amazonaws),',
              '  "amazon": OrgIconData(Icons.cloud, Color(0xFFFF9900)),',
          )
          replace(
              'lib/features/proxy/active/ip_widget.dart',
              '  "oracle": OrgIconData(SimpleIcons.oracle, SimpleIconColors.oracle),',
              '  "oracle": OrgIconData(Icons.storage, Color(0xFFF80000)),',
          )
          PY

          git diff --check
          git diff

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/icon-api-migration.yml
          git add lib/features/profile/details/json_editor.dart \
                  lib/features/home/widget/connection_button.dart \
                  lib/features/profile/widget/profile_tile_main.dart \
                  lib/features/proxy/active/ip_widget.dart
          git commit -m "fix(ui): migrate icon APIs"
          git push origin HEAD:update-all-2026-10-03
