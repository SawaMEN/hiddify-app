name: Opera Proxy smoke check

on:
  workflow_dispatch:
  push:
    branches: ['fix/opera-*']
    paths:
      - 'android/app/src/main/kotlin/com/hiddify/hiddify/nativeprofile/NativeOpera*.kt'
      - 'android/app/src/test/kotlin/com/hiddify/hiddify/nativeprofile/NativeOpera*.kt'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/opera-proxy-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: Test TLS, authorization, catalog and profile regressions
        run: ./android/gradlew -p tool/kotlin-tests test --console=plain
      - name: Verify real Opera registration and HTTP/HTTPS traffic through every endpoint
        run: ./android/gradlew -p tool/kotlin-tests operaSmoke --console=plain
