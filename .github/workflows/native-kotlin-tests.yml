name: Native core race regressions

on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'
      - 'tool/download_core_modules.py'
      - 'tool/checkout_stable_core_source.py'
      - 'tool/fetch_stable_android_core.py'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'
      - 'tool/download_core_modules.py'
      - 'tool/checkout_stable_core_source.py'
      - 'tool/fetch_stable_android_core.py'

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Checkout source of latest stable core release for regression tests
        run: python3 tool/checkout_stable_core_source.py --latest
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: hiddify-core/go.mod
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum
      - name: Download released core modules with network retries
        run: python3 tool/download_core_modules.py
      - name: Test core route composition and profile validation without APK
        working-directory: hiddify-core
        run: go test -race -ldflags=-checklinkname=0 -tags with_quic,with_utls,with_gvisor,with_wireguard,with_clash_api ./v2/config ./v2/hcore ./platform/mobile
      - name: Test WARP bootstrap cancellation and readiness without external tunnels
        working-directory: hiddify-core/hiddify-sing-box
        run: go test -race -ldflags=-checklinkname=0 -tags with_wireguard ./protocol/warp
      - name: Test Psiphon transport and shutdown without external tunnels
        working-directory: hiddify-core/hiddify-sing-box
        run: go test -race -ldflags=-checklinkname=0 ./protocol/psiphon ./protocol/hiddify/dnstt
