name: Native Kotlin regression tests

on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test production Kotlin without Android, JNI or APK
        run: bash android/gradlew -p tool/kotlin-tests test --console=plain
