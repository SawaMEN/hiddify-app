name: Native Kotlin regression tests

on:
  pull_request:
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'
      - 'hiddify-core'
  push:
    branches: [main]
    paths:
      - 'android/app/src/main/kotlin/**'
      - 'android/app/src/test/kotlin/**'
      - 'tool/kotlin-tests/**'
      - '.github/workflows/native-kotlin-tests.yml'
      - 'hiddify-core'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test production Kotlin without Android, JNI or APK
        run: bash android/gradlew -p tool/kotlin-tests test --console=plain

  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: hiddify-core/go.mod
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum
      - name: Test core route composition and profile validation without APK
        working-directory: hiddify-core
        run: go test -race -ldflags=-checklinkname=0 -tags with_quic,with_utls,with_gvisor,with_wireguard,with_clash_api ./v2/config ./v2/hcore ./platform/mobile
      - name: Test Psiphon transport and shutdown without external tunnels
        working-directory: hiddify-core/hiddify-sing-box
        run: go test -race -ldflags=-checklinkname=0 ./protocol/psiphon ./protocol/hiddify/dnstt
