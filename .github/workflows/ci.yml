name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
      - fixerror
      - kotlin-rewrite

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      contents: write
    if: "${{ !contains(github.event.head_commit.message || '', 'release: version') }}"
    with:
      upload-artifact: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'dev') }}
      run-checks: true
      run-tests: true
