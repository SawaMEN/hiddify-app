name: macOS Signed DMG (Developer ID + Notarization)

on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "Signed build destination (public requires device acceptance)"
        type: choice
        required: true
        default: private-test
        options:
          - private-test
          - public-preview
      acceptance_commit:
        description: "For public preview: exact commit tested on a signed physical Mac"
        required: false
        type: string
      acceptance_report_url:
        description: "For public preview: link to documented TCP/UDP, DNS, IPv6 and reconnect results"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vetroff-macos-signed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    outputs:
      public: ${{ steps.gate.outputs.public }}
    steps:
      - name: Require immutable main-branch candidate and physical test evidence
        id: gate
        env:
          DIST: ${{ inputs.distribution }}
          EXPECTED: ${{ github.sha }}
          REF_NAME: ${{ github.ref }}
          ACCEPTED: ${{ inputs.acceptance_commit }}
          RECORD: ${{ inputs.acceptance_report_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$REF_NAME" == "refs/heads/main" ]] || {
            echo "::error::Signed distribution may only be triggered on main." >&2
            exit 1
          }
          if [[ "$DIST" == "public-preview" ]]; then
            [[ "$ACCEPTED" == "$EXPECTED" ]] || {
              echo "::error::The signed-device test must cover this exact commit." >&2; exit 1;
            }
            [[ "$RECORD" == https://github.com/* ]] || {
              echo "::error::Provide the GitHub acceptance-test report URL." >&2; exit 1;
            }
            for pr in 83 84; do
              merged="$(gh api "repos/${{ github.repository }}/pulls/$pr" --jq '.merged')"
              [[ "$merged" == true ]] || {
                echo "::error::PR #$pr must be merged before public distribution." >&2; exit 1;
              }
            done
            echo "public=true" >> "$GITHUB_OUTPUT"
          else
            echo "public=false" >> "$GITHUB_OUTPUT"
          fi

  signed-dmg:
    needs: acceptance-gate
    runs-on: macos-15
    timeout-minutes: 85
    environment: macos-signing
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Download exact pinned Go ARM64 framework
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_NAME="HiddifyCore-macos-37ed16781062"
          RUN_ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=$ARTIFACT_NAME&per_page=100" \
            --jq '.artifacts | map(select(.expired == false)) | .[0].workflow_run.id // empty')"
          [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]] || {
            echo "::error::Pinned XCFramework unavailable. Run macOS Native Core Build." >&2; exit 1;
          }
          mkdir -p macos/Core/HiddifyCore.xcframework
          gh run download "$RUN_ID" --repo "${{ github.repository }}" \
            --name "$ARTIFACT_NAME" --dir macos/Core/HiddifyCore.xcframework
          test -f macos/Core/HiddifyCore.xcframework/macos-arm64/HiddifyCore.framework/HiddifyCore

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Developer ID sign VetrOFF and PacketTunnel; package ONE DMG
        env:
          VETROFF_TEAM_ID: ${{ secrets.MACOS_APPLE_TEAM_ID }}
          MACOS_CERT_P12_B64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_APP_PROFILE_B64: ${{ secrets.MACOS_APP_PROVISION_PROFILE_BASE64 }}
          MACOS_TUN_PROFILE_B64: ${{ secrets.MACOS_TUN_PROVISION_PROFILE_BASE64 }}
        run: bash macos/scripts/build-developer-id.sh

      - name: Notarize one DMG and staple the Apple ticket
        env:
          NOTARY_KEY_B64: ${{ secrets.MACOS_NOTARY_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${NOTARY_KEY_B64:?Apple notarization API key is required}"
          : "${NOTARY_KEY_ID:?Notarization key ID missing}"
          : "${NOTARY_ISSUER_ID:?Notarization issuer ID missing}"
          key="$(mktemp "$RUNNER_TEMP/vetroff-notary.XXXXXX.p8")"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$NOTARY_KEY_B64" | base64 -D > "$key"
          chmod 600 "$key"
          DMG="dist/VetrOFF-macOS-arm64.dmg"
          xcrun notarytool submit "$DMG" --key "$key" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary-response.json"
          python3 - "$RUNNER_TEMP/notary-response.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as f:
              result = json.load(f)
          if result.get("status") != "Accepted":
              raise SystemExit("Apple notarization did not accept the signed DMG.")
          print("Apple notarization: Accepted.")
          PY
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          hdiutil verify -quiet "$DMG"
          spctl -a -t open --context context:primary-signature -v "$DMG"
          test "$(find dist -maxdepth 1 -type f | wc -l | tr -d ' ')" = 1

      - name: Immutable release metadata
        id: info
        run: |
          echo "tag=macos-signed-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 dist/VetrOFF-macOS-arm64.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload one DMG for private signed-device acceptance
        if: needs.acceptance-gate.outputs.public != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: VetrOFF-macOS-arm64-signed-private-test
          path: dist/VetrOFF-macOS-arm64.dmg
          retention-days: 7
          if-no-files-found: error

      - name: Publish exactly one notarized prerelease DMG
        if: needs.acceptance-gate.outputs.public == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "VetrOFF macOS ARM64 — signed technical preview"
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/VetrOFF-macOS-arm64.dmg
          body: |
            Signed and Apple-notarized macOS ARM64 technical preview.
            One file: VetrOFF-macOS-arm64.dmg.
            SHA-256: ${{ steps.info.outputs.sha256 }}

            The publicly released build corresponds to ${{ github.sha }}.
            Signed-device test report: ${{ inputs.acceptance_report_url }}.

            The Release VPN connection remains deliberately disabled until
            traffic forwarding and DNS/IPv6 leak acceptance are complete.
            A notarization ticket proves Apple accepted the software for
            distribution, NOT that VPN transport security is verified.
