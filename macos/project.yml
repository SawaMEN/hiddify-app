name: VetrOFF
options:
  bundleIdPrefix: app.vetroff.client
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
targets:
  VetrOFF:
    type: application
    platform: macOS
    sources:
      - path: VetrOFF
        excludes:
          - Info.plist
          - VetrOFF.entitlements
    info:
      path: VetrOFF/Info.plist
    entitlements:
      path: VetrOFF/VetrOFF.entitlements
    dependencies:
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos
        PRODUCT_NAME: VetrOFF
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VetrOFF/Info.plist
  PacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - PacketTunnel.entitlements
    info:
      path: PacketTunnel/Info.plist
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  VetrOFFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VetrOFF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VetrOFF.app/Contents/MacOS/VetrOFF"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VetrOFF:
    build:
      targets:
        VetrOFF: all
        PacketTunnel: all
    test:
      targets:
        - VetrOFFTests
