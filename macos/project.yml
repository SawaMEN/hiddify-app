name: VetrOFF
options:
  bundleIdPrefix: app.vetroff.client
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
packages:
  Yams:
    url: https://github.com/jpsim/Yams.git
    exactVersion: 5.4.0
targets:
  VetrOFF:
    type: application
    platform: macOS
    sources:
      - path: VetrOFF
        excludes:
          - Info.plist
          - VetrOFF.entitlements
      - path: Shared
    info:
      path: VetrOFF/Info.plist
    entitlements:
      path: VetrOFF/VetrOFF.entitlements
    preBuildScripts:
      - name: Prepare VetrOFF artwork
        script: bash "$SRCROOT/scripts/prepare-assets.sh"
        basedOnDependencyAnalysis: true
        inputFiles:
          - "$(SRCROOT)/scripts/prepare-assets.sh"
          - "$(SRCROOT)/../assets/images/source/vetroff-launcher-mark.png"
        outputFiles:
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/BrandMark.imageset/image.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_16_1.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_16_2.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_32_1.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_32_2.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_128_1.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_128_2.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_256_1.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_256_2.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_512_1.png"
          - "$(SRCROOT)/VetrOFF/Assets.xcassets/AppIcon.appiconset/icon_512_2.png"
    dependencies:
      - package: Yams
      - target: PacketTunnel
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos
        PRODUCT_NAME: VetrOFF
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: VetrOFF/Info.plist
  PacketTunnel:
    type: app-extension
    platform: macOS
    sources:
      - path: PacketTunnel
        excludes:
          - Info.plist
          - PacketTunnel.entitlements
      - path: Shared
    info:
      path: PacketTunnel/Info.plist
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos.PacketTunnel
        PRODUCT_NAME: PacketTunnel
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PacketTunnel/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
  VetrOFFTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: VetrOFF
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vetroff.client.macos.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VetrOFF.app/Contents/MacOS/VetrOFF"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  VetrOFF:
    build:
      targets:
        VetrOFF: all
        PacketTunnel: all
    test:
      targets:
        - VetrOFFTests
